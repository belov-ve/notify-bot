services:
  notify-bot:
    container_name: notify-bot
    build:
      context: ./build
    image: notify-bot:3.4.2
    # Для точной фильтрации по IP рекомендуется network_mode: host
    network_mode: host
    # bridge – возможно все клиенты будут видны с IP Docker-шлюза,
    # что делает allowed_ips бесполезным, требует проверки. Используйте только для тестов.
    # network_mode: bridge
    # ports:
    #   - "8040:8040/tcp" # дополнительный порт для health check (можно любой)
    #   - "8041-8050:8041-8050/tcp"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data:rw
      - ./data/scripts:/app/scripts:ro
    environment:
      # Уровень логирования можно переопределить через переменную окружения
      # [INFO,WARNING,ERROR,DEBUG]
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HEALTH_CHECK_PORT=8040 # порт для health check
      - DB_PATH=/app/data/notify_bot.db
      - SCRIPT_TIMEOUT=${SCRIPT_TIMEOUT:-15}
      # - TZ=${TZ:-UTC}
      - TZ=Europe/Moscow
    restart: unless-stopped
    stop_grace_period: 20s
    labels:
      - "autoheal=true"
