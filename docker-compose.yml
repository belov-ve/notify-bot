services:

  notify-tbot:
    build: .
    image: notify-tbot:1.0.3
    network_mode: host
    # Альтернатива (bridge) – возможно все клиенты будут видны с IP Docker-шлюза,
    # что делает allowed_ips бесполезным. Требует проверки. Используйте только для тестов.
    # network_mode: bridge
    ports:
      - "8040-8042:8040-8042/tcp"
    volumes:
      - ./config.yml:/app/config.yml:ro
    environment:
      # [INFO,WARNING,ERROR,DEBUG]
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
